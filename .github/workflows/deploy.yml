name: Deploy Serverless API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-serverless-api
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "boto3==1.35.0" "moto[dynamodb]==5.0.14" "pytest==8.3.2"

      - name: Run tests
        env:
          TABLE_NAME:            blog-posts
          ALLOWED_ORIGIN:        "*"
          AWS_DEFAULT_REGION:    eu-west-2
          AWS_ACCESS_KEY_ID:     testing
          AWS_SECRET_ACCESS_KEY: testing
        run: pytest tests/ -v

  deploy:
    name: Deploy Lambda function
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-2

      - name: Package Lambda function
        run: |
          mkdir -p build
          zip -j build/lambda.zip src/handler.py

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://build/lambda.zip

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Print API endpoint
        run: |
          echo "Deployment complete!"
          echo "API endpoint: ${{ secrets.API_ENDPOINT }}/posts"
